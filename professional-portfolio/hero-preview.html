<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Preview — brush asset test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F9F6EF;
    --mustard: #EDAA3A;
    --ink: #1C3A4B;
    --teal: #2E7D66;
    --coral: #E4572E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--mustard);
    font-family: 'Poppins', sans-serif;
    color: var(--ink);
    padding: 48px;
  }
  .canvas {
    background: var(--cream);
    max-width: 1200px;
    margin: 0 auto;
    border-radius: 4px;
    overflow: hidden;
  }

  /* ---------- nav ---------- */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px 56px 0;
  }
  .logo { font-family: 'Caveat', cursive; font-size: 34px; font-weight: 600; }
  .nav-links { display: flex; gap: 36px; align-items: center; }
  .nav-links a {
    text-decoration: none;
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 18px;
  }
  /* the "parenthesis" pill on the active link */
  .nav-links a.active {
    color: var(--teal);
    border: 1.5px solid var(--teal);
    border-radius: 999px;
    border-top-color: transparent;
    border-bottom-color: transparent;
  }
  .nav-contact { display: flex; align-items: center; gap: 14px; font-size: 13px; font-weight: 500; }
  .phone-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: #fff; display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(28,58,75,.10);
  }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    padding: 72px 56px 0;
    min-height: 640px;
  }
  h1 {
    font-size: 64px;
    line-height: 1.12;
    font-weight: 700;
    max-width: 480px;
    position: relative;
    z-index: 3;
  }
  .tagline {
    position: absolute;
    top: 110px; right: 56px;
    width: 200px;
    font-size: 14px;
    line-height: 1.7;
    z-index: 3;
  }
  .email {
    position: absolute;
    top: 320px; left: 56px;
    color: var(--coral);
    font-size: 14px;
    font-weight: 500;
    z-index: 3;
  }
  .years {
    position: absolute;
    bottom: 64px; left: 56px;
    display: flex; align-items: center; gap: 10px;
    z-index: 3;
  }
  .years b { font-size: 56px; font-weight: 700; }
  .years span { font-size: 12px; letter-spacing: .1em; line-height: 1.5; }

  /* brush + person composition */
  .figure {
    position: absolute;
    left: 50%; bottom: 0;
    transform: translateX(-50%);
    width: 560px; height: 520px;
    z-index: 2;
  }
  .figure .brush {
    position: absolute;
    left: 40px; bottom: 60px;
    width: 340px;
    transform: rotate(14deg) scaleX(1.35);
    transform-origin: center;
  }
  /* placeholder person: swap for your cut-out photo */
  .person {
    position: absolute;
    left: 50%; bottom: 0;
    transform: translateX(-50%);
    width: 300px; height: 380px;
  }
  .person .head {
    width: 130px; height: 150px;
    background: #C9BDA8;
    border-radius: 60px 60px 52px 52px;
    margin: 0 auto;
  }
  .person .body {
    width: 300px; height: 240px;
    background: #C9BDA8;
    border-radius: 110px 110px 0 0;
    margin-top: -10px;
  }

  /* ---------- circular badge ---------- */
  .badge {
    position: absolute;
    right: 90px; bottom: 150px;
    text-align: center;
    width: 200px;
    z-index: 3;
  }
  .badge svg { width: 110px; height: 110px; }
  .badge p { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-top: 10px; line-height: 1.5; }

  /* ---------- variants strip ---------- */
  .variants {
    background: #fff;
    padding: 36px 56px 48px;
    border-top: 1px solid rgba(28,58,75,.08);
  }
  .variants h2 { font-size: 15px; margin-bottom: 20px; letter-spacing: .05em; text-transform: uppercase; }
  .variants .row { display: flex; gap: 40px; align-items: center; }
  .variants figure { text-align: center; font-size: 12px; color: #7a8790; }
  .variants img { height: 150px; display: block; margin: 0 auto 8px; }
  .v2 { transform: rotate(45deg); }
  .v3 { transform: rotate(90deg) scaleX(1.4); }
  .v4 { transform: scaleX(-1) rotate(20deg); }
</style>
</head>
<body>
  <div class="canvas">
    <nav>
      <div class="logo">Sam</div>
      <div class="nav-links">
        <a class="active" href="#">Services</a>
        <a href="#">Works</a>
        <a href="#">Notes</a>
        <a href="#">Experience</a>
      </div>
      <div class="nav-contact">
        +1 (000) 000 0000
        <div class="phone-btn">☎</div>
      </div>
    </nav>

    <section class="hero">
      <h1>Hey There,<br>I&rsquo;m Sam</h1>
      <p class="tagline">I build clean, reliable software. And I love what I do.</p>
      <a class="email" href="mailto:samuel.choe99@gmail.com">samuel.choe99@gmail.com</a>
      <div class="years"><b>N</b><span>YEARS<br>EXPERIENCE</span></div>

      <div class="figure">
        <img class="brush" src="assets/brush-smear.svg" alt="">
        <div class="person">
          <div class="head"></div>
          <div class="body"></div>
        </div>
      </div>

      <div class="badge">
        <svg viewBox="0 0 120 120">
          <defs>
            <path id="ring" d="M 60,60 m -44,0 a 44,44 0 1,1 88,0 a 44,44 0 1,1 -88,0"/>
          </defs>
          <circle cx="60" cy="60" r="56" fill="none" stroke="#1C3A4B" stroke-width="1" stroke-dasharray="3 4"/>
          <text font-size="10.5" letter-spacing="2.5" fill="#1C3A4B" font-family="Poppins, sans-serif" font-weight="600">
            <textPath href="#ring">SAMUEL CHOE &#183; PORTFOLIO &#183; EST 2026 &#183;</textPath>
          </text>
          <text x="60" y="67" text-anchor="middle" font-size="22" font-weight="700" fill="#1C3A4B" font-family="Poppins, sans-serif">SC</text>
        </svg>
        <p>Software<br>Developer</p>
      </div>
    </section>

    <section class="variants">
      <h2>Brush orientation options (CSS transform only)</h2>
      <div class="row">
        <figure><img src="assets/brush-smear.svg" alt=""><figcaption>original</figcaption></figure>
        <figure><img class="v2" src="assets/brush-smear.svg" alt=""><figcaption>rotate 45&deg;</figcaption></figure>
        <figure><img class="v3" src="assets/brush-smear.svg" alt=""><figcaption>rotate 90&deg; + stretch</figcaption></figure>
        <figure><img class="v4" src="assets/brush-smear.svg" alt=""><figcaption>mirrored</figcaption></figure>
      </div>
    </section>
  </div>
</body>
</html>
